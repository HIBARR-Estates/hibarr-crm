syntax = "proto3";

package hibarr.crm.task_user;

import "common.proto";

option php_namespace = "App\\Grpc\\Generated\\TaskUser";
option php_metadata_namespace = "App\\Grpc\\Generated\\GPBMetadata";

// TaskUser entity - junction between Task and User
message TaskUser {
  int64 id = 1;
  int64 task_id = 2;
  int64 user_id = 3;
  string created_at = 4;
  string updated_at = 5;
}

// Request to list task users with pagination and filters
message ListTaskUsersRequest {
  hibarr.crm.common.PaginationRequest pagination = 1;

  // Filters
  optional int64 task_id = 2;
  optional int64 user_id = 3;
}

// Response containing a list of task users
message ListTaskUsersResponse {
  repeated TaskUser result = 1;
  hibarr.crm.common.PaginationMeta pagination = 2;
}

// Stream request for bulk task user export
message StreamTaskUsersRequest {
  hibarr.crm.common.StreamRequest stream_params = 1;

  // Optional filters
  optional int64 task_id = 2;
  optional int64 user_id = 3;
}

// Streamed batch of task users
message TaskUserBatch {
  repeated TaskUser result = 1;
  hibarr.crm.common.StreamProgress progress = 2;
}

// TaskUser Service definition
service TaskUserService {
  // List task users with pagination
  rpc List(ListTaskUsersRequest) returns (ListTaskUsersResponse);

  // Stream task users for bulk export
  rpc Stream(StreamTaskUsersRequest) returns (stream TaskUserBatch);
}
