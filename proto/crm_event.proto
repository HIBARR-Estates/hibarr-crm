syntax = "proto3";

package hibarr.crm.crm_event;

option php_namespace = "App\\Grpc\\Generated\\CrmEvent";
option php_metadata_namespace = "App\\Grpc\\Generated\\GPBMetadata";

import "common.proto";

// ─── Messages ────────────────────────────────────────────────

// Represents a single CRM event
message CrmEventMessage {
  int64 id = 1;
  string uuid = 2;
  int64 company_id = 3;
  int64 event_type_id = 4;
  string event_type_slug = 5;
  string event_type_name = 6;
  string category_slug = 7;
  string category_name = 8;
  string generation_type = 9; // user_generated | system_generated
  int64 user_id = 10;
  string model_type = 11;
  int64 model_id = 12;
  string correlation_id = 13;
  int64 causation_id = 14;
  string source = 15; // api, grpc, observer, controller, job, middleware, system
  string ip_address = 16;
  string user_agent = 17;
  string metadata_json = 18; // JSON-encoded metadata
  string occurred_at = 19; // ISO8601
  string created_at = 20; // ISO8601
}

// Represents an event type definition
message CrmEventTypeMessage {
  int64 id = 1;
  string slug = 2;
  string name = 3;
  string description = 4;
  string model_type = 5;
  string category_slug = 6;
  string category_name = 7;
  bool is_system = 8;
  bool is_active = 9;
  bool sync_processing = 10;
  string business_rule_slug = 11;
  string business_rule_name = 12;
}

// ─── Requests / Responses ────────────────────────────────────

// Record a single event
message RecordEventRequest {
  string event_type_slug = 1;
  string business_rule_slug = 2;
  string model_type = 3;
  int64 model_id = 4;
  int64 user_id = 5;
  string generation_type = 6;
  string correlation_id = 7;
  int64 causation_id = 8;
  string metadata_json = 9; // JSON-encoded metadata
  string occurred_at = 10; // ISO8601
  string ip_address = 11;
  string user_agent = 12;
}

message RecordEventResponse {
  CrmEventMessage event = 1;
  bool accepted = 2; // true if accepted (may be async)
}

// Record multiple events
message RecordBatchRequest {
  repeated RecordEventRequest events = 1;
}

message RecordBatchResponse {
  repeated CrmEventMessage events = 1;
  int32 recorded_count = 2;
}

// Query events with filters
message QueryEventsRequest {
  string event_type_slug = 1;
  string category_slug = 2;
  string model_type = 3;
  int64 model_id = 4;
  int64 user_id = 5;
  string generation_type = 6;
  string source = 7;
  string correlation_id = 8;
  string date_from = 9; // ISO8601
  string date_to = 10; // ISO8601
  hibarr.crm.common.PaginationRequest pagination = 11;
}

message QueryEventsResponse {
  repeated CrmEventMessage events = 1;
  hibarr.crm.common.PaginationMeta pagination = 2;
}

// Get event chain by correlation ID
message EventChainRequest {
  string correlation_id = 1;
}

message EventChainResponse {
  repeated CrmEventMessage events = 1;
  string correlation_id = 2;
  int32 total_events = 3;
}

// List available event types
message ListEventTypesRequest {
  string category_slug = 1;
  string model_type = 2;
}

message ListEventTypesResponse {
  repeated CrmEventTypeMessage event_types = 1;
}

// ─── Service Definition ──────────────────────────────────────

service CrmEventService {
  // Record a single CRM event
  rpc RecordEvent (RecordEventRequest) returns (RecordEventResponse);

  // Record a batch of CRM events
  rpc RecordBatch (RecordBatchRequest) returns (RecordBatchResponse);

  // Query events with filters and pagination
  rpc QueryEvents (QueryEventsRequest) returns (QueryEventsResponse);

  // Get the full event chain for a correlation ID
  rpc GetEventChain (EventChainRequest) returns (EventChainResponse);

  // List available event type definitions
  rpc ListEventTypes (ListEventTypesRequest) returns (ListEventTypesResponse);
}
