syntax = "proto3";

package hibarr.crm.deal_watcher;

import "common.proto";

option php_namespace = "App\\Grpc\\Generated\\DealWatcher";
option php_metadata_namespace = "App\\Grpc\\Generated\\GPBMetadata";

// DealWatcher entity - junction between Deal and User
message DealWatcher {
  int64 id = 1;
  int64 deal_id = 2;
  int64 user_id = 3;
  string created_at = 4;
  string updated_at = 5;
}

// Request to list deal watchers with pagination and filters
message ListDealWatchersRequest {
  hibarr.crm.common.PaginationRequest pagination = 1;

  // Filters
  optional int64 deal_id = 2;
  optional int64 user_id = 3;
}

// Response containing a list of deal watchers
message ListDealWatchersResponse {
  repeated DealWatcher result = 1;
  hibarr.crm.common.PaginationMeta pagination = 2;
}

// Stream request for bulk deal watcher export
message StreamDealWatchersRequest {
  hibarr.crm.common.StreamRequest stream_params = 1;

  // Optional filters
  optional int64 deal_id = 2;
  optional int64 user_id = 3;
}

// Streamed batch of deal watchers
message DealWatcherBatch {
  repeated DealWatcher result = 1;
  hibarr.crm.common.StreamProgress progress = 2;
}

// DealWatcher Service definition
service DealWatcherService {
  // List deal watchers with pagination
  rpc List(ListDealWatchersRequest) returns (ListDealWatchersResponse);

  // Stream deal watchers for bulk export
  rpc Stream(StreamDealWatchersRequest) returns (stream DealWatcherBatch);
}
