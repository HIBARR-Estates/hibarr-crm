syntax = "proto3";

package hibarr.crm.task_category;

import "common.proto";

option php_namespace = "App\\Grpc\\Generated\\TaskCategory";
option php_metadata_namespace = "App\\Grpc\\Generated\\GPBMetadata";

// TaskCategory entity
message TaskCategory {
  int64 id = 1;
  int64 company_id = 2;
  int64 added_by = 3;
  int64 last_updated_by = 4;
  string category_name = 5;
  string created_at = 6;
  string updated_at = 7;
}

// Request to list task categories with pagination and filters
message ListTaskCategoriesRequest {
  hibarr.crm.common.PaginationRequest pagination = 1;

  // Filters
  optional string search = 2;       // Search in category_name
}

// Response containing a list of task categories
message ListTaskCategoriesResponse {
  repeated TaskCategory result = 1;
  hibarr.crm.common.PaginationMeta pagination = 2;
}

// Stream request for bulk task category export
message StreamTaskCategoriesRequest {
  hibarr.crm.common.StreamRequest stream_params = 1;

  // Optional filters
  optional string search = 2;
}

// Streamed batch of task categories
message TaskCategoryBatch {
  repeated TaskCategory result = 1;
  hibarr.crm.common.StreamProgress progress = 2;
}

// TaskCategory Service definition
service TaskCategoryService {
  // List task categories with pagination
  rpc List(ListTaskCategoriesRequest) returns (ListTaskCategoriesResponse);

  // Stream task categories for bulk export
  rpc Stream(StreamTaskCategoriesRequest) returns (stream TaskCategoryBatch);
}
