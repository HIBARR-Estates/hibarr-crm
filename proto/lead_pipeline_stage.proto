syntax = "proto3";

package hibarr.crm.lead_pipeline_stage;

import "common.proto";

option php_namespace = "App\\Grpc\\Generated\\LeadPipelineStage";
option php_metadata_namespace = "App\\Grpc\\Generated\\GPBMetadata";

// LeadPipelineStage entity - junction between LeadPipeline and PipelineStage
message LeadPipelineStage {
  int64 id = 1;
  int64 lead_pipeline_id = 2;
  int64 pipeline_stages_id = 3;
  string created_at = 4;
  string updated_at = 5;
}

// Request to list lead pipeline stages with pagination and filters
message ListLeadPipelineStagesRequest {
  hibarr.crm.common.PaginationRequest pagination = 1;

  // Filters
  optional int64 lead_pipeline_id = 2;
  optional int64 pipeline_stages_id = 3;
}

// Response containing a list of lead pipeline stages
message ListLeadPipelineStagesResponse {
  repeated LeadPipelineStage result = 1;
  hibarr.crm.common.PaginationMeta pagination = 2;
}

// Stream request for bulk lead pipeline stage export
message StreamLeadPipelineStagesRequest {
  hibarr.crm.common.StreamRequest stream_params = 1;

  // Optional filters
  optional int64 lead_pipeline_id = 2;
  optional int64 pipeline_stages_id = 3;
}

// Streamed batch of lead pipeline stages
message LeadPipelineStageBatch {
  repeated LeadPipelineStage result = 1;
  hibarr.crm.common.StreamProgress progress = 2;
}

// LeadPipelineStage Service definition
service LeadPipelineStageService {
  // List lead pipeline stages with pagination
  rpc List(ListLeadPipelineStagesRequest) returns (ListLeadPipelineStagesResponse);

  // Stream lead pipeline stages for bulk export
  rpc Stream(StreamLeadPipelineStagesRequest) returns (stream LeadPipelineStageBatch);
}
