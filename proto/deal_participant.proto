syntax = "proto3";

package hibarr.crm.deal_participant;

import "common.proto";

option php_namespace = "App\\Grpc\\Generated\\DealParticipant";
option php_metadata_namespace = "App\\Grpc\\Generated\\GPBMetadata";

// DealParticipant entity - junction between Deal and User
message DealParticipant {
  int64 id = 1;
  int64 deal_id = 2;
  int64 user_id = 3;
  string created_at = 4;
  string updated_at = 5;
}

// Request to list deal participants with pagination and filters
message ListDealParticipantsRequest {
  hibarr.crm.common.PaginationRequest pagination = 1;

  // Filters
  optional int64 deal_id = 2;
  optional int64 user_id = 3;
}

// Response containing a list of deal participants
message ListDealParticipantsResponse {
  repeated DealParticipant result = 1;
  hibarr.crm.common.PaginationMeta pagination = 2;
}

// Stream request for bulk deal participant export
message StreamDealParticipantsRequest {
  hibarr.crm.common.StreamRequest stream_params = 1;

  // Optional filters
  optional int64 deal_id = 2;
  optional int64 user_id = 3;
}

// Streamed batch of deal participants
message DealParticipantBatch {
  repeated DealParticipant result = 1;
  hibarr.crm.common.StreamProgress progress = 2;
}

// DealParticipant Service definition
service DealParticipantService {
  // List deal participants with pagination
  rpc List(ListDealParticipantsRequest) returns (ListDealParticipantsResponse);

  // Stream deal participants for bulk export
  rpc Stream(StreamDealParticipantsRequest) returns (stream DealParticipantBatch);
}
