server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /var/www/html/public;
    index index.php index.html;

    client_max_body_size 64M;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    charset utf-8;

    # Host is published as localhost:8080 → container :80. Don't 301 to :80.
    absolute_redirect off;
    port_in_redirect off;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # These paths stay the same across deploys. A CDN that fills in its own
    # lifetime (Cloudflare's default is 4 hours) will keep the previous
    # main.js, and Blade then has no selectpicker or easyAjax.
    location = /js/main.js {
        add_header Cache-Control "no-cache";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
    location = /css/main.css {
        add_header Cache-Control "no-cache";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
    location = /css/tailwind.css {
        add_header Cache-Control "no-cache";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Polled by open tabs to detect a new deploy; must never be served stale.
    location = /build-version.json {
        add_header Cache-Control "no-store";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        # Debian nginx sets HTTP_HOST=$host (no port). Keep the browser Host so
        # Laravel redirects stay on :8080 instead of :80.
        fastcgi_param HTTP_HOST $http_host;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 300;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
