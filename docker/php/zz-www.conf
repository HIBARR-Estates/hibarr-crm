; Loaded after the image's zz-docker.conf so these pool values win.
[www]
clear_env = no

pm = dynamic
pm.max_children = 20
pm.start_servers = 5
pm.min_spare_servers = 3
pm.max_spare_servers = 10
pm.max_requests = 500

; Liveness probe: answers without running any PHP, so it stays cheap and
; independent of the database. Reached through nginx at /healthz.
ping.path = /fpm-ping
ping.response = pong
