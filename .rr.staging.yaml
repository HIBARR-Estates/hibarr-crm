version: "3"

# RoadRunner Server Configuration for HiBarr CRM gRPC Services — STAGING
#
# Differences from development (.rr.yaml):
#   - gRPC + status bind to 127.0.0.1 (nginx terminates TLS and proxies)
#   - Production-grade logging (warn level, JSON encoding)
#   - Worker pool tuned for staging server resources
#
# Managed via systemd: sudo systemctl start|stop|restart roadrunner-grpc

server:
  command: "php worker.php"
  relay: pipes

# gRPC Plugin Configuration
# Phase 1 (IP testing): Bound to 0.0.0.0 so clients can connect directly via IP:9001.
# Phase 2 (domain+TLS): Change to 127.0.0.1 once nginx is proxying with TLS.
grpc:
  listen: "tcp://0.0.0.0:9001"
  proto:
    - "proto/common.proto"
    - "proto/communication_activity.proto"
    - "proto/communication_activity_file.proto"
    - "proto/country.proto"
    - "proto/currency.proto"
    - "proto/deal.proto"
    - "proto/deal_file.proto"
    - "proto/deal_follow_up.proto"
    - "proto/deal_history.proto"
    - "proto/deal_note.proto"
    - "proto/deal_participant.proto"
    - "proto/deal_watcher.proto"
    - "proto/developer.proto"
    - "proto/developer_project.proto"
    - "proto/developer_project_asset.proto"
    - "proto/developer_project_unit_type.proto"
    - "proto/developer_project_unit_type_asset.proto"
    - "proto/hibarr_deal_fields.proto"
    - "proto/lead.proto"
    - "proto/lead_agent.proto"
    - "proto/lead_category.proto"
    - "proto/lead_marketing.proto"
    - "proto/lead_pipeline.proto"
    - "proto/lead_pipeline_stage.proto"
    - "proto/lead_source.proto"
    - "proto/lead_status.proto"
    - "proto/meeting_summary.proto"
    - "proto/meeting_type.proto"
    - "proto/package.proto"
    - "proto/pipeline_stage.proto"
    - "proto/property.proto"
    - "proto/property_asset.proto"
    - "proto/task.proto"
    - "proto/task_category.proto"
    - "proto/task_history.proto"
    - "proto/task_user.proto"
    - "proto/taskable.proto"
    - "proto/taskboard_column.proto"
  pool:
    num_workers: 4
    max_jobs: 500
    allocate_timeout: 60s
    destroy_timeout: 60s

# Health Check / Status Plugin
# Phase 1: 0.0.0.0 for remote health checks during testing.
# Phase 2: Change to 127.0.0.1 once nginx is in front.
status:
  address: "0.0.0.0:2114"

# Logging Configuration — production-grade
logs:
  mode: production
  level: warn
  encoding: json
  output: stderr

# RPC for internal communication (worker resets, metrics, etc.)
rpc:
  listen: "tcp://127.0.0.1:6001"
