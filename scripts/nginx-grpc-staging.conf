# /etc/nginx/sites-available/grpc-staging
#
# Nginx reverse proxy for HiBarr CRM gRPC (staging).
# Terminates TLS and forwards gRPC traffic to RoadRunner on 127.0.0.1:9001.
#
# Install:
#   sudo cp scripts/nginx-grpc-staging.conf /etc/nginx/sites-available/grpc-staging
#   sudo ln -sf /etc/nginx/sites-available/grpc-staging /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d grpc.staging.YOURDOMAIN.com
#   sudo nginx -t && sudo systemctl reload nginx
#
# NOTE: Replace grpc.staging.YOURDOMAIN.com with your actual domain before deploying.

# Upstream — the local RoadRunner gRPC server
upstream grpc_backend {
    server 127.0.0.1:9001;
    keepalive 32;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name grpc.staging.YOURDOMAIN.com;

    # TLS certificates — managed by certbot (Let's Encrypt)
    # After running certbot, these paths will be auto-populated.
    ssl_certificate     /etc/letsencrypt/live/grpc.staging.YOURDOMAIN.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/grpc.staging.YOURDOMAIN.com/privkey.pem;

    # Modern TLS settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # gRPC proxy to RoadRunner
    location / {
        grpc_pass grpc://grpc_backend;

        # Timeouts — gRPC calls can be long-running (streaming, large lists)
        grpc_read_timeout    300s;
        grpc_send_timeout    300s;
        grpc_connect_timeout 10s;

        # Pass client IP to upstream
        grpc_set_header X-Real-IP $remote_addr;
        grpc_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Standard gRPC error handling
    # Map nginx errors to gRPC status codes
    error_page 400 = @grpc_bad_request;
    error_page 401 = @grpc_unauthenticated;
    error_page 403 = @grpc_permission_denied;
    error_page 404 = @grpc_unimplemented;
    error_page 429 = @grpc_resource_exhausted;
    error_page 502 = @grpc_unavailable;
    error_page 503 = @grpc_unavailable;
    error_page 504 = @grpc_deadline_exceeded;

    location @grpc_bad_request       { default_type application/grpc; add_header grpc-status 3;  add_header grpc-message "Bad request";         return 204; }
    location @grpc_unauthenticated   { default_type application/grpc; add_header grpc-status 16; add_header grpc-message "Unauthenticated";     return 204; }
    location @grpc_permission_denied { default_type application/grpc; add_header grpc-status 7;  add_header grpc-message "Permission denied";   return 204; }
    location @grpc_unimplemented     { default_type application/grpc; add_header grpc-status 12; add_header grpc-message "Unimplemented";       return 204; }
    location @grpc_resource_exhausted{ default_type application/grpc; add_header grpc-status 8;  add_header grpc-message "Resource exhausted";  return 204; }
    location @grpc_unavailable       { default_type application/grpc; add_header grpc-status 14; add_header grpc-message "Service unavailable"; return 204; }
    location @grpc_deadline_exceeded { default_type application/grpc; add_header grpc-status 4;  add_header grpc-message "Deadline exceeded";   return 204; }

    # Access logging
    access_log /var/log/nginx/grpc-staging-access.log;
    error_log  /var/log/nginx/grpc-staging-error.log warn;
}

# Redirect plain HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name grpc.staging.YOURDOMAIN.com;
    return 301 https://$host$request_uri;
}
