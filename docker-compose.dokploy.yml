# Hibarr CRM on Dokploy (Docker Compose application).
#
# Runs the image CI publishes to GHCR; nothing is built on the Dokploy host.
# See docs/dokploy.md for setup, the data move from the Jenkins server, and rollback.
#
# Release order, enforced by depends_on: `migrate` runs first and must exit 0
# before app/queue/scheduler are (re)created. If a migration fails, the deploy
# fails and the previous containers keep running.
#
# No ports are published and no Traefik labels are written here: attach the
# domain to the `app` service (port 80) in Dokploy's Domains tab.
#
# Required environment (Dokploy -> Environment):
#   IMAGE_TAG              develop (staging) | main (production) | sha-<short> (pin / rollback)
#   APP_URL                public https URL, e.g. https://crm.example.com
#   INFISICAL_API_URL      https://infisical.hibarr.org
#   INFISICAL_PROJECT_ID   the project id from .infisical.json
#   INFISICAL_ENV          prod | staging
#   INFISICAL_CLIENT_ID + INFISICAL_CLIENT_SECRET   machine identity (preferred)
#     or INFISICAL_TOKEN   a static token
# Optional: RUN_MIGRATIONS is not used here (the migrate service replaces it),
#   QUEUE_NAMES, OTEL_LOGS_ENABLED, REDIRECT_HTTPS (default true).

x-image: &image ghcr.io/hibarr-estates/hibarr-crm:${IMAGE_TAG:?Set IMAGE_TAG (develop, main or sha-<short>)}

x-env: &env
  INFISICAL_API_URL: ${INFISICAL_API_URL:?Set INFISICAL_API_URL}
  INFISICAL_PROJECT_ID: ${INFISICAL_PROJECT_ID:?Set INFISICAL_PROJECT_ID}
  INFISICAL_ENV: ${INFISICAL_ENV:?Set INFISICAL_ENV (prod or staging)}
  INFISICAL_CLIENT_ID: ${INFISICAL_CLIENT_ID:-}
  INFISICAL_CLIENT_SECRET: ${INFISICAL_CLIENT_SECRET:-}
  INFISICAL_TOKEN: ${INFISICAL_TOKEN:-}
  APP_URL: ${APP_URL:?Set APP_URL to the public https URL}
  APP_BUNDLER: mix
  GRPC_ENABLED: "false"
  REDIRECT_HTTPS: ${REDIRECT_HTTPS:-true}
  OTEL_LOGS_ENABLED: ${OTEL_LOGS_ENABLED:-false}

x-volumes: &volumes
  - hibarr_storage:/var/www/html/storage
  - hibarr_uploads:/var/www/html/public/user-uploads

services:
  migrate:
    image: *image
    pull_policy: always
    restart: "no"
    environment:
      <<: *env
      CONTAINER_ROLE: migrate
    volumes: *volumes
    extra_hosts:
      - "host.docker.internal:host-gateway"

  app:
    image: *image
    pull_policy: always
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *env
      CONTAINER_ROLE: app
      # The migrate service owns migrations; do not also run them on every start.
      RUN_MIGRATIONS: "false"
    volumes: *volumes
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      # nginx -> php-fpm ping; never boots Laravel or touches the database.
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      # Covers the Infisical fetch and the MySQL wait before FPM is up.
      start_period: 90s

  queue:
    image: *image
    pull_policy: always
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *env
      CONTAINER_ROLE: queue
    volumes: *volumes
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Let running jobs finish on redeploy (worker --timeout is 300s).
    stop_grace_period: 6m

  scheduler:
    image: *image
    pull_policy: always
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *env
      CONTAINER_ROLE: scheduler
    volumes: *volumes
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  hibarr_storage:
  hibarr_uploads:
