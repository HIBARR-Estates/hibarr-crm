version: "3.8"

services:
  traefik:
    image: traefik:v2.10
    container_name: hibarr-crm-traefik
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.myresolver.acme.tlschallenge=true"
      # - "--certificatesresolvers.myresolver.acme.caserver=https://acme-staging-v02.api.letsencrypt.org/directory" # Uncomment for testing to avoid rate limits
      - "--certificatesresolvers.myresolver.acme.email=admin@hibarr.de"
      - "--certificatesresolvers.myresolver.acme.storage=/letsencrypt/acme.json"
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    volumes:
      - "./docker/traefik/letsencrypt:/letsencrypt"
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    networks:
      - hibarr-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        user: hibarr
        uid: 1000
    image: hibarr-crm-app
    container_name: hibarr-crm-app
    restart: unless-stopped
    working_dir: /var/www/html
    env_file:
      - .env
    volumes:
      - ./:/var/www/html
    networks:
      - hibarr-network

  nginx:
    image: nginx:alpine
    container_name: hibarr-crm-nginx
    restart: unless-stopped
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - hibarr-network
    labels:
      - "traefik.enable=true"
      # Update the Host rule to your actual domain
      - "traefik.http.routers.hibarr-crm.rule=Host(`crm.hibarr.de`)"
      - "traefik.http.routers.hibarr-crm.entrypoints=websecure"
      - "traefik.http.routers.hibarr-crm.tls.certresolver=myresolver"
      - "traefik.http.services.hibarr-crm.loadbalancer.server.port=80"
      # Middleware to redirect HTTP to HTTPS
      - "traefik.http.routers.hibarr-crm-http.rule=Host(`crm.hibarr.de`)"
      - "traefik.http.routers.hibarr-crm-http.entrypoints=web"
      - "traefik.http.routers.hibarr-crm-http.middlewares=redirect-to-https"
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"

networks:
  hibarr-network:
    driver: bridge
