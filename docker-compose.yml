x-infisical: &infisical-env
  INFISICAL_TOKEN: ${INFISICAL_TOKEN:?Set INFISICAL_TOKEN in .env}
  INFISICAL_API_URL: ${INFISICAL_API_URL:?Set INFISICAL_API_URL in .env}
  INFISICAL_PROJECT_ID: ${INFISICAL_PROJECT_ID:?Set INFISICAL_PROJECT_ID in .env}
  INFISICAL_ENV: ${INFISICAL_ENV:-dev}

# One image, three roles. Set CRM_IMAGE to a registry tag when the image is built elsewhere.
x-crm-image: &crm-image
  image: ${CRM_IMAGE:-hibarr-crm:latest}

services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        BUILD_ID: ${BUILD_ID:-}
        BUILD_PREFIX: ${BUILD_PREFIX:-hibarr-crm}
    <<: *crm-image
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    environment:
      <<: *infisical-env
      GRPC_ENABLED: "false"
      CONTAINER_ROLE: app
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-false}
      OTEL_LOGS_ENABLED: ${OTEL_LOGS_ENABLED:-false}
      APP_URL: ${APP_URL:-http://localhost:8080}
      APP_BUNDLER: vite
      REDIRECT_HTTPS: ${REDIRECT_HTTPS:-false}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
    volumes:
      - hibarr_storage:/var/www/html/storage
      - hibarr_uploads:/var/www/html/public/user-uploads
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # nginx is up before PHP-FPM; / boots Laravel and 302s to login when healthy.
    # start_period covers Infisical export plus up to ~2 min of DB wait (DB_WAIT_TRIES x 2s)
    # and PHP-FPM boot, with margin.
    # String form is CMD-SHELL. The exec-array form was ignored by some
    # compose runners, so the check never started.
    healthcheck:
      test: curl -fsS -o /dev/null --max-time 8 http://127.0.0.1/ || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 300s

  queue:
    <<: *crm-image
    restart: unless-stopped
    environment:
      <<: *infisical-env
      GRPC_ENABLED: "false"
      CONTAINER_ROLE: queue
      OTEL_LOGS_ENABLED: ${OTEL_LOGS_ENABLED:-false}
      RUN_MIGRATIONS: "false"
      APP_URL: ${APP_URL:-http://localhost:8080}
      APP_BUNDLER: vite
      REDIRECT_HTTPS: ${REDIRECT_HTTPS:-false}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
    volumes:
      - hibarr_storage:/var/www/html/storage
      - hibarr_uploads:/var/www/html/public/user-uploads
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      app:
        condition: service_healthy

  scheduler:
    <<: *crm-image
    restart: unless-stopped
    environment:
      <<: *infisical-env
      GRPC_ENABLED: "false"
      CONTAINER_ROLE: scheduler
      OTEL_LOGS_ENABLED: ${OTEL_LOGS_ENABLED:-false}
      RUN_MIGRATIONS: "false"
      APP_URL: ${APP_URL:-http://localhost:8080}
      APP_BUNDLER: vite
      REDIRECT_HTTPS: ${REDIRECT_HTTPS:-false}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
    volumes:
      - hibarr_storage:/var/www/html/storage
      - hibarr_uploads:/var/www/html/public/user-uploads
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      app:
        condition: service_healthy

volumes:
  hibarr_storage:
  hibarr_uploads:
