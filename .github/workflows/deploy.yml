name: Deploy WorkSuite CRM to Production

on:
  push:
    branches:
      - staging
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-22.04

    steps:
      - name: Deploy on server via SSH
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGIN_SSH_PRIVATE_KEY }}
          script: |
            cd ~/hibarr-crm
            git pull origin staging
            rsync -av --exclude 'public/user-uploads' --exclude 'public/favicon.ico' --exclude 'storage/app/modules_statuses.json' --exclude 'Modules' --exclude '.env' ~/hibarr-crm/ /var/www/html/worksuite-staging
            cd /var/www/html/worksuite-staging
            composer install --no-interaction --prefer-dist --optimize-autoloader
            npm install
            npm run production
            php artisan migrate --force
