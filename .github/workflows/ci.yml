name: CI

# Fast feedback on every PR, and a published Docker image for long-lived branches.
#
# Speed comes from: path filters (docs-only PRs run nothing), jobs that run in
# parallel instead of one long pipeline, tests sharded across runners, and
# caches for Composer, npm and the webpack module cache.
#
# Deploys are still done by the Jenkinsfile (bare-metal) or by pulling the image
# this workflow publishes (docker compose). Neither is triggered from here.

on:
  # Every pull request, whatever its base: PRs into develop, staging and main
  # all run the checks, and so do stacked PRs into feature branches. Adding a
  # `branches:` filter here would only ever remove coverage.
  pull_request:
  push:
    branches: [develop, staging, main, master]
  workflow_dispatch:

concurrency:
  # A newer push to the same PR supersedes the older run. Never cancel a run on
  # a long-lived branch: it may be midway through publishing an image.
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  COMPOSER_NO_INTERACTION: 1
  # Throwaway key so the app can boot in CI. Never used for real data.
  APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      php: ${{ steps.filter.outputs.php }}
      frontend: ${{ steps.filter.outputs.frontend }}
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            php:
              - '**/*.php'
              - 'composer.json'
              - 'composer.lock'
              - 'phpunit.xml'
              - 'phpstan.neon.dist'
              - 'resources/views/**'
              - 'resources/lang/**'
              - 'scripts/ci/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'resources/js/**'
              - 'resources/css/**'
              - 'resources/scss/**'
              - 'resources/views/**'
              - 'public/vendor/**'
              - 'package.json'
              - 'package-lock.json'
              - 'webpack.mix.js'
              - 'vite.config.mjs'
              - 'tailwind.config.js'
              - 'postcss.config.js'
              - 'tsconfig.json'
              - '.babelrc'
              - '.github/workflows/ci.yml'
            docker:
              - 'docker/**'
              - 'scripts/ci/**'
              - 'proto/**'
              - 'worker.php'
              - '.rr*.yaml'
              - 'app/Grpc/**'
              - 'docker-compose.yml'
              - '.dockerignore'
              - 'composer.json'
              - 'composer.lock'
              - 'package.json'
              - 'package-lock.json'
              - 'webpack.mix.js'
              - '.github/workflows/ci.yml'

  tests:
    name: PHPUnit (shard ${{ matrix.shard }}/4)
    needs: changes
    if: needs.changes.outputs.php == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          # Everything composer.lock requires, plus the sqlite driver the suite uses.
          extensions: bcmath, ctype, curl, dom, fileinfo, filter, gd, iconv, intl, json, libxml, mbstring, openssl, pdo_sqlite, phar, session, simplexml, sockets, sodium, sqlite3, tokenizer, xml, xmlreader, xmlwriter, xsl, zip, zlib
          coverage: none
          tools: composer:v2
          ini-values: memory_limit=-1

      - name: Restore Composer cache
        uses: actions/cache@v4
        with:
          path: |
            vendor
            ~/.cache/composer
          key: composer-php8.3-${{ hashFiles('composer.lock') }}
          restore-keys: composer-php8.3-

      # No-op when vendor/ was restored for this exact lock file.
      - name: Install PHP dependencies
        run: composer install --no-progress --prefer-dist --no-scripts

      - name: Prepare app
        run: cp .env.example .env

      - name: Build this shard's phpunit config
        run: python3 scripts/ci/phpunit-shard.py ${{ matrix.shard }} 4

      - name: Run tests
        run: vendor/bin/phpunit -c phpunit.shard.xml --colors=always

  lint:
    name: Pint + PHPStan (changed files)
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.php == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Non-blocking while the repo baseline is unknown: the checks report on the
    # files a PR touches, but a red result does not fail CI yet. Flip this to
    # `false` (or delete the line) once the baseline is clean.
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: bcmath, ctype, curl, dom, fileinfo, filter, gd, iconv, intl, json, libxml, mbstring, openssl, pdo_sqlite, phar, session, simplexml, sockets, sodium, sqlite3, tokenizer, xml, xmlreader, xmlwriter, xsl, zip, zlib
          coverage: none
          tools: composer:v2
          ini-values: memory_limit=-1

      - name: Restore Composer cache
        uses: actions/cache@v4
        with:
          path: |
            vendor
            ~/.cache/composer
          key: composer-php8.3-${{ hashFiles('composer.lock') }}
          restore-keys: composer-php8.3-

      - name: Install PHP dependencies
        run: composer install --no-progress --prefer-dist --no-scripts

      - name: List changed PHP files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" \
            --jq '.[] | select(.status != "removed") | .filename' \
            | grep -E '\.php$' > changed-php.txt || true
          echo "Changed PHP files: $(wc -l < changed-php.txt)"

      - name: Pint
        run: |
          [ -s changed-php.txt ] || { echo "No PHP changes."; exit 0; }
          xargs vendor/bin/pint --test < changed-php.txt

      - name: PHPStan
        run: |
          grep -E '^(app|database)/' changed-php.txt > stan-files.txt || true
          [ -s stan-files.txt ] || { echo "No analysable PHP changes."; exit 0; }
          cp .env.example .env
          xargs vendor/bin/phpstan analyse --no-progress --memory-limit=1G --error-format=github < stan-files.txt

  frontend:
    name: Frontend build (Mix)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # Persist webpack's module cache (see webpack.mix.js) so unchanged files
      # are not recompiled on the next run.
      WEBPACK_FS_CACHE: '1'
    steps:
      - uses: actions/checkout@v4

      # Match the Docker image (node:20) so CI builds what ships.
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install JS dependencies
        run: npm ci --no-audit --fund=false --prefer-offline

      # After `npm ci`, which deletes node_modules (and any cache inside it).
      # The cache is ~600 MB compressed and GitHub keeps 10 GB per repository,
      # so only pushes to develop save it; PRs restore develop's copy.
      - name: Restore webpack module cache
        uses: actions/cache/restore@v4
        with:
          path: node_modules/.cache
          key: webpack-${{ runner.os }}-${{ hashFiles('package-lock.json', 'webpack.mix.js') }}-${{ github.sha }}
          restore-keys: |
            webpack-${{ runner.os }}-${{ hashFiles('package-lock.json', 'webpack.mix.js') }}-
            webpack-${{ runner.os }}-

      # The real file is generated by `php artisan ziggy:generate` (needs the PHP
      # app). A bundling check only needs the module to exist.
      - name: Stub Ziggy routes
        run: |
          printf 'const Ziggy = {url: "http://localhost", port: null, defaults: {}, routes: {}};\nexport { Ziggy };\nexport default Ziggy;\n' > resources/js/ziggy.js

      - name: Build
        run: npm run production

      - name: Save webpack module cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        uses: actions/cache/save@v4
        with:
          path: node_modules/.cache
          key: webpack-${{ runner.os }}-${{ hashFiles('package-lock.json', 'webpack.mix.js') }}-${{ github.sha }}

  docker:
    name: Docker image
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-,format=short

      - name: Build${{ github.event_name != 'pull_request' && ' and push' || '' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_ID=${{ github.run_number }}
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test image
        run: |
          IMAGE="$(echo "${{ steps.meta.outputs.tags }}" | head -n1)"
          docker run --rm --entrypoint sh "$IMAGE" -c '
            set -e
            php -v | head -n1
            for ext in pdo_mysql redis gd intl bcmath zip opcache pcntl exif; do php -m | grep -qix "$ext" || { echo "missing php ext: $ext"; exit 1; }; done
            nginx -t
            test -f public/mix-manifest.json
            test -f resources/js/ziggy.js
            test -f public/build-version.json
          '

      # Renders a PDF through Browsershot's real node script, as root (queue
      # worker) and www-data (PHP-FPM). Catches a wrong Debian package name, a
      # missing Chrome library or font, or a puppeteer/Chrome version mismatch.
      - name: Smoke test PDF rendering
        run: |
          IMAGE="$(echo "${{ steps.meta.outputs.tags }}" | head -n1)"
          docker run --rm -v "$PWD/scripts/ci:/ci:ro" --entrypoint sh "$IMAGE" /ci/smoke-pdf.sh

      # RoadRunner matches composer.lock, worker.php and every generated protobuf
      # class autoload, and a message round-trips through the installed runtime.
      - name: Smoke test gRPC server
        run: |
          IMAGE="$(echo "${{ steps.meta.outputs.tags }}" | head -n1)"
          docker run --rm -v "$PWD/scripts/ci:/ci:ro" --entrypoint sh "$IMAGE" /ci/smoke-grpc.sh

      # Starts RoadRunner with the real worker.php and waits for the listener.
      # Informational until it has passed once on a runner: the workers boot
      # Laravel without a database, which has not been exercised yet.
      - name: gRPC boot test (informational)
        continue-on-error: true
        run: |
          IMAGE="$(echo "${{ steps.meta.outputs.tags }}" | head -n1)"
          docker run --rm -v "$PWD/scripts/ci:/ci:ro" -e GRPC_BOOT=1 --entrypoint sh "$IMAGE" /ci/smoke-grpc.sh

  # Deploys the image built above by asking Dokploy to redeploy the Compose app,
  # then waits until the new release is the one answering. Off until the repo
  # variable DOKPLOY_ENABLED is 'true', so merging this changes nothing by itself.
  # develop -> staging, main -> production (GitHub Environments of those names
  # hold DOKPLOY_URL, DOKPLOY_COMPOSE_ID, APP_URL and the DOKPLOY_API_KEY secret;
  # add required reviewers to `production` for a manual approval gate).
  # See docs/dokploy.md.
  deploy:
    name: Deploy (${{ github.ref_name == 'main' && 'production' || 'staging' }})
    needs: docker
    if: >-
      github.event_name == 'push' &&
      vars.DOKPLOY_ENABLED == 'true' &&
      (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
    concurrency:
      group: deploy-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Trigger Dokploy deploy
        env:
          DOKPLOY_URL: ${{ vars.DOKPLOY_URL }}
          DOKPLOY_COMPOSE_ID: ${{ vars.DOKPLOY_COMPOSE_ID }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
        run: |
          : "${DOKPLOY_URL:?DOKPLOY_URL is not set for this environment}"
          : "${DOKPLOY_COMPOSE_ID:?DOKPLOY_COMPOSE_ID is not set for this environment}"
          : "${DOKPLOY_API_KEY:?DOKPLOY_API_KEY secret is not set for this environment}"
          # The Compose app follows a branch tag (develop / main) with
          # pull_policy: always, so a redeploy picks up the image just pushed.
          curl --fail-with-body -sS -X POST "${DOKPLOY_URL%/}/api/compose.deploy" \
            -H "x-api-key: ${DOKPLOY_API_KEY}" \
            -H 'Content-Type: application/json' \
            -d "{\"composeId\": \"${DOKPLOY_COMPOSE_ID}\"}"
          echo

      - name: Wait for this release to go live
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          : "${APP_URL:?APP_URL is not set for this environment}"
          expected="$(printf '%s' "$GITHUB_SHA" | cut -c1-7)"
          for i in $(seq 1 60); do
            body="$(curl -fsS --max-time 10 "${APP_URL%/}/build-version.json" 2>/dev/null || true)"
            case "$body" in
              *"-${expected}"*)
                echo "Release ${expected} is live."
                curl -fsS --max-time 10 "${APP_URL%/}/healthz" && echo
                exit 0 ;;
            esac
            echo "Waiting for release ${expected} (attempt ${i}/60)..."
            sleep 10
          done
          echo "::error::Release ${expected} was not live after 10 minutes. Check the deployment log in Dokploy."
          exit 1

  # Single required check for branch protection: it is green when every job
  # that ran passed, and when jobs were skipped by the path filters. `lint` is
  # left out on purpose while it is non-blocking.
  ci-ok:
    name: CI passed
    needs: [changes, tests, frontend, docker]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        run: |
          echo '${{ toJSON(needs) }}'
          if echo '${{ join(needs.*.result, ' ') }}' | grep -Eq 'failure|cancelled'; then
            echo "A required job failed or was cancelled."
            exit 1
          fi
