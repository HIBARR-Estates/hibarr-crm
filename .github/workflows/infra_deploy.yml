name: Deploy WorkSuite CRM

on:
  push:
    branches:
      - main
      - staging
  workflow_dispatch:

jobs:
  deploy-staging:
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-22.04

    steps:
      - name: Deploy to Staging Server
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          port: ${{ secrets.STAGING_PORT }}
          script: |
            echo "📁 Switching to staging codebase..."
            cd ~/hibarr-crm-staging

            echo "🧹 Cleaning old state..."
            git restore --staged .
            git restore .
            git clean -fd

            echo "⬇️ Pulling latest code..."
            git pull origin staging

            echo "🐳 Restarting containers..."
            make down || true
            make up

            echo "📦 Installing Composer deps..."
            make composer

            echo "⚙️ Running migrations (staging)..."
            make migrate

            echo "🎨 Building frontend assets..."
            make npm-install
            make npm-build

            echo "🔄 Restarting queues..."
            make queue-restart

            echo "🚀 Staging deployment complete."

  deploy-main:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04

    steps:
      - name: Deploy to Production Server
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.REMOTE_HOST_2 }}
          username: ${{ secrets.REMOTE_USER_2 }}
          key: ${{ secrets.SSH_PRIVATE_KEY_2 }}
          port: ${{ secrets.PROD_PORT }}
          script: |
            echo "📁 Switching to production codebase..."
            cd ~/hibarr-crm

            echo "🧹 Cleaning old state..."
            git restore --staged .
            git restore .
            git clean -fd

            echo "⬇️ Pulling latest code..."
            git pull origin main

            echo "🐳 Restarting containers..."
            make down || true
            make up

            echo "📦 Installing Composer deps..."
            make composer

            echo "⚙️ Running migrations (production)..."
            make migrate-prod

            echo "🎨 Building frontend assets..."
            make npm-install
            make npm-build

            echo "🔄 Restarting queues..."
            make queue-restart

            echo "🔥 Production deployment complete."
