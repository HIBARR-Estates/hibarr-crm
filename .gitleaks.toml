# Secret scanning config, used by `make security-secrets`
# (gitleaks detect --no-banner --redact).

[extend]
useDefault = true

[allowlist]
description = "Files that only ever hold placeholders or upstream hashes"
paths = [
  '''\.env\.example$''',
  '''composer\.lock$''',
  '''package-lock\.json$''',
  '''public/js/.*\.min\.js$''',
  '''public/vendor/.*''',
  '''scripts/security-audit-baseline\.json$''',
]
